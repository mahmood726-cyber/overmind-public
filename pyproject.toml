[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overmind"
version = "3.1.0"
description = "Local evidence-first orchestration for terminal coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
embeddings = [
  "sentence-transformers>=5.5.1",
]

[project.scripts]
overmind = "overmind.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["overmind*"]

[tool.setuptools.package-data]
overmind = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "C4", "I", "N", "UP", "SIM", "PIE", "RET", "RUF"]
ignore = ["E501", "B011", "N812", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "N802", "N803", "N806", "RUF"]
"conftest.py" = ["B", "N802", "N803", "N806"]
